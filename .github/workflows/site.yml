name: site

# Builds site/ and publishes it to GitHub Pages.
# Requires: Settings → Pages → Build and deployment → Source = GitHub Actions.
#
# The build and the deploy are separate jobs on purpose. The build is what
# proves the site compiles and type-checks, and it must keep passing even
# when Pages has not been enabled on the repository yet — otherwise a
# permission problem reads as a broken site.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci --include=dev

      - name: Typecheck and build
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist

  deploy:
    name: publish to pages
    needs: build
    runs-on: ubuntu-latest
    # Pages has to be switched on for the repository before this can run. When it has
    # not been, the deploy is skipped rather than failed: the site still builds, and the
    # reason is stated once instead of on every push.
    if: github.repository_owner == 'LangerSword'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        id: pages
        # The step is allowed to fail so that a repository without Pages still gets a
        # green build. Its outcome is checked below, so the failure is contained.
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        # The conclusion is checked rather than the outcome: a step that was allowed to
        # fail reports "failure" as its outcome even when it succeeded, which would skip
        # the upload that actually publishes the site.
        if: steps.pages.conclusion == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deployment
        if: steps.pages.conclusion == 'success'
        uses: actions/deploy-pages@v4
